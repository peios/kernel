name: Kernel style and core tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-style-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Install the pinned Rust tools
        run: |
          rustup toolchain install 1.83.0 --profile minimal --component rustfmt
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install locked style tools
        run: python peios/style.py setup
      - name: Check style and the style command
        run: |
          python peios/style.py check
          python peios/style/test_style.py
      - name: Test shared Rust cores and userspace ABI bindings
        run: |
          bash peios/rust/check.sh
          bash peios/rust/peios-uapi/check-codegen-safe.sh
          bash peios/rust/peios-uapi/check-userspace-clean.sh
      - name: Check generated KMES event tables
        run: python peios/gen-kmes-event-table.py --check && python peios/test_kmes_event_table.py
      - name: Check data generators and qualification harnesses
        run: |
          python peios/gen-port-reservations-seed.py --check && python peios/test_data_generators.py
          python peios/test_kunit_runner.py
          bash peios/qualification/check-build.sh
      - name: Review kernel checkpatch findings (advisory)
        if: github.event_name == 'pull_request'
        run: bash peios/style/review.sh HEAD^
